services:
  zerotier-planet:
    image: ${DOCKER_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped

    # 端口映射
    ports:
      - "${ZT_PORT}:${ZT_PORT}"
      - "${ZT_PORT}:${ZT_PORT}/udp"
      - "${API_PORT}:${API_PORT}"
      - "${FILE_PORT}:${FILE_PORT}"

    # 环境变量
    environment:
      - IP_ADDR4=${IP_ADDR4}
      - IP_ADDR6=${IP_ADDR6}
      - ZT_PORT=${ZT_PORT}
      - API_PORT=${API_PORT}
      - FILE_SERVER_PORT=${FILE_PORT}

    # 卷挂载
    # 确保左侧是宿主机的绝对路径或相对路径，右侧是容器内路径
    volumes:
      - ./data/zerotier:/app/dist
      - ./data/zerotier/ztncui:/app/ztncui
      - ./data/zerotier/one:/var/lib/zerotier-one
      - ./data/zerotier/config:/app/config
